<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuxico Parauapebas - Notícias da Cidade</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="title-container">
            <h1 class="main-title animate-pop-in">Fuxico Parauapebas</h1>
            <p class="subtitle animate-fade-in">As últimas novidades da nossa cidade</p>
        </div>
        <div class="logo-container animate-fade-in">
            <img src="images/logo.png" alt="Logo de Parauapebas" class="city-logo">
        </div>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Notícias</a></li>
            <li><a href="#">Eventos</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="admin/index.html">Admin</a></li>
        </ul>
    </nav>

    <main class="news-container">
        <!-- As notícias serão carregadas dinamicamente aqui -->
        <div class="loading-animation">
            <div class="spinner"></div>
            <p>Carregando notícias...</p>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2023 Fuxico Parauapebas - Todos os direitos reservados</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
